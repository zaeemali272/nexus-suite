[package]
name = "nexus-client"
version = "0.1.0"
edition = "2021"
authors = ["Nexus Suite Engineering Team"]
description = "Native GPU-accelerated Slint frontend bindings for Nexus Suite."

[[bin]]
name = "nexus-client"
path = "src/main.rs"

[dependencies]
nexus-core = { path = "../nexus-core" }
nexus-db = { path = "../nexus-db" }
nexus-net = { path = "../nexus-net" }
nexus-daemon = { path = "../nexus-daemon" }
slint = "1.9"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.14"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
sha2 = "0.10"

[build-dependencies]
slint-build = "1.9"
