[package]
name = "nexus-db"
version = "0.1.0"
edition = "2021"
authors = ["Nexus Suite Engineering Team"]
description = "Hyper-optimized SQLite storage layer with WAL mode and sqlx connection pool."

[dependencies]
nexus-core = { path = "../nexus-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono"] }
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"

[dev-dependencies]
tempfile = "3.14"
